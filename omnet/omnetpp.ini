*.manager.autoShutdown = false
*.manager.ignoreGuiCommands = true
*.manager.moduleType = "org.car2x.veins.subprojects.veins_inet.VeinsInetCar"
**.vector-recording = false
*.node[*].app[*].**.vector-recording = true
